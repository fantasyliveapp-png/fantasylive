##############################################################################
# FantasyLive - ruta del almacenamiento (SeaweedFS) dentro de la web principal
#
# No es un sitio aparte: es un bloque "location" que deploy/setup-storage.sh
# copia a /etc/nginx/snippets/fantasylive-storage.conf (sustituyendo
# __BUCKET__) y anade con "include" a los bloques server del dominio.
#
# https://tudominio.com/__BUCKET__/... -> SeaweedFS (S3) en 127.0.0.1:18333, sin
# reescribir la ruta ni el Host: las URLs firmadas de S3 incluyen los dos en
# la firma, y cualquier cambio las invalidaria.
#
# Los navegadores suben las fotos y videos DIRECTAMENTE aqui con una URL
# firmada por la app, sin pasar por Next.js. Por eso el limite de tamano es
# mucho mayor que el del resto de la web (8 MB).
##############################################################################

location ^~ /__BUCKET__/ {
    # Videos: hasta 2 GB por archivo.
    client_max_body_size 2g;

    # Sin buffer: el archivo va al almacenamiento segun llega, en vez de acumularse
    # entero en disco en nginx antes de empezar a subirse.
    proxy_request_buffering off;
    proxy_buffering off;

    proxy_pass http://127.0.0.1:18333;

    # El almacenamiento comprueba la firma con el Host: tiene que llegar intacto.
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    chunked_transfer_encoding off;

    proxy_connect_timeout 300;
    proxy_send_timeout 300;
    proxy_read_timeout 300;
}
