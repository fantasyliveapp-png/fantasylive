##############################################################################
# FantasyLive - proxy inverso del almacenamiento (MinIO)
#
# Instalar en /etc/nginx/sites-available/fantasylive-storage y enlazar en
# sites-enabled. Sustituye __STORAGE_NAME__ por el subdominio de archivos
# (p. ej. files.tudominio.com). Lo hace deploy/setup-storage.sh.
#
# Va en su propio subdominio y no en una ruta (/storage) a proposito: las
# URLs firmadas de S3 incluyen el host y la ruta en la firma, y reescribir la
# ruta en el proxy las invalida.
#
# Los navegadores suben las fotos y videos DIRECTAMENTE aqui con una URL
# firmada por la app, sin pasar por Next.js. Por eso el limite de tamano es
# mucho mayor que el del sitio principal.
##############################################################################

server {
    listen 80;
    listen [::]:80;
    server_name __STORAGE_NAME__;

    server_tokens off;

    # Videos: hasta 2 GB por archivo.
    client_max_body_size 2g;

    # Sin buffer: el archivo va a MinIO segun llega, en vez de acumularse
    # entero en disco en nginx antes de empezar a subirse.
    proxy_request_buffering off;
    proxy_buffering off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    location / {
        proxy_pass http://127.0.0.1:9000;

        # MinIO comprueba la firma con el Host: tiene que llegar intacto.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        chunked_transfer_encoding off;

        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        proxy_read_timeout 300;
    }
}
