##############################################################################
# FantasyLive - proxy inverso nginx
#
# Instalar en /etc/nginx/sites-available/fantasylive y enlazar en
# sites-enabled. Sustituye __SERVER_NAME__ por tu dominio (o la IP).
##############################################################################

# Mapa para WebSocket / SSE: conserva la cabecera Upgrade cuando la hay.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__;

    # Tamano maximo de cuerpo: los Server Actions aceptan hasta 4 MB.
    # El contenido pesado va directo a S3/R2 con URL firmada, no por aqui.
    client_max_body_size 8m;

    # No revelar la version de nginx en errores ni en la cabecera Server.
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # ------------------------------------------------------------------------
    # SEGURIDAD DEL BLOQUEO GEOGRAFICO
    #
    # La app confia en estas cabeceras para deducir el pais (config.geo.
    # trustProxyHeaders). Si llegasen desde el cliente, cualquiera podria
    # saltarse el bloqueo por pais mandando "CF-IPCountry: US" a mano.
    # Asignarles cadena vacia hace que nginx NO las reenvie.
    #
    # Si algun dia pones Cloudflare delante, ELIMINA la linea de CF-IPCountry
    # (para que pase la de Cloudflare) y sube GEO_TRUSTED_PROXY_HOPS a 2.
    # ------------------------------------------------------------------------
    proxy_set_header CF-IPCountry "";
    proxy_set_header X-Vercel-IP-Country "";
    proxy_set_header X-Geo-Country "";
    proxy_set_header X-Country-Code "";

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # X-Real-IP es la fuente de verdad de la IP del cliente: nginx la fija
        # a $remote_addr siempre, machacando lo que enviase el navegador.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Host $host;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header CF-IPCountry "";
        proxy_set_header X-Vercel-IP-Country "";
        proxy_set_header X-Geo-Country "";
        proxy_set_header X-Country-Code "";

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_cache_bypass $http_upgrade;
    }

    # Server-Sent Events del emparejamiento: sin buffering ni timeout corto,
    # o el navegador perderia los eventos de match.
    location /api/matchmaking/stream {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        proxy_set_header Connection '';

        proxy_set_header CF-IPCountry "";
        proxy_set_header X-Vercel-IP-Country "";
        proxy_set_header X-Geo-Country "";
        proxy_set_header X-Country-Code "";

        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;
    }

    # Estaticos con hash en el nombre: cache larga e inmutable.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Nunca servir ficheros de entorno ni metadatos de git.
    location ~ /\.(env|git) {
        deny all;
        return 404;
    }
}

##############################################################################
# HTTPS
#
# La instalacion se hace hoy por HTTP porque el servidor se accede por IP y
# una autoridad publica no emite certificados para direcciones IP.
#
# En cuanto apuntes un dominio a esta maquina:
#   1) sustituye __SERVER_NAME__ arriba por el dominio,
#   2) sudo certbot --nginx -d tudominio.com -d www.tudominio.com
#      (certbot anade el bloque 443 y la redireccion desde el 80),
#   3) cambia NEXT_PUBLIC_APP_URL, NEXTAUTH_URL y AUTH_URL del .env a
#      https://tudominio.com y reinicia: systemctl restart fantasylive
#
# El paso 3 es imprescindible: hasta que la app se sirva por HTTPS, la cookie
# de sesion no puede marcarse Secure.
##############################################################################
