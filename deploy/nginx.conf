##############################################################################
# FantasyLive - proxy inverso nginx
#
# Instalar en /etc/nginx/sites-available/fantasylive y enlazar en
# sites-enabled. Sustituye __SERVER_NAME__ por tu dominio.
#
# Si el dominio pasa por Cloudflare, genera ademas
# /etc/nginx/conf.d/cloudflare.conf con deploy/cloudflare-realip.sh: define
# $cf_country y la IP real del visitante. Sin ese fichero nginx no arranca,
# porque aqui se usa $cf_country.
##############################################################################

# Mapa para WebSocket / SSE: conserva la cabecera Upgrade cuando la hay.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__;

    # Tamano maximo de cuerpo: los Server Actions aceptan hasta 4 MB.
    # El contenido pesado va directo a S3/R2 con URL firmada, no por aqui.
    client_max_body_size 8m;

    # No revelar la version de nginx en errores ni en la cabecera Server.
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # ------------------------------------------------------------------------
    # SEGURIDAD DEL BLOQUEO GEOGRAFICO
    #
    # La app deduce el pais de estas cabeceras (config.geo.trustProxyHeaders).
    # Si llegasen desde el cliente, cualquiera se saltaria el bloqueo mandando
    # "CF-IPCountry: US" a mano. Asignar cadena vacia hace que no se reenvien.
    #
    # CF-IPCountry es la excepcion: $cf_country vale la cabecera de Cloudflare
    # SOLO cuando la conexion viene de una IP suya, y cadena vacia cuando
    # alguien ataca directamente a la IP del origen. Ver
    # /etc/nginx/conf.d/cloudflare.conf.
    # ------------------------------------------------------------------------
    proxy_set_header CF-IPCountry $cf_country;
    proxy_set_header X-Vercel-IP-Country "";
    proxy_set_header X-Geo-Country "";
    proxy_set_header X-Country-Code "";

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # $remote_addr ya es la IP real del visitante: real_ip_header
        # CF-Connecting-IP la sustituye cuando la conexion viene de Cloudflare.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Host $host;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header CF-IPCountry $cf_country;
        proxy_set_header X-Vercel-IP-Country "";
        proxy_set_header X-Geo-Country "";
        proxy_set_header X-Country-Code "";

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_cache_bypass $http_upgrade;
    }

    # Server-Sent Events del emparejamiento: sin buffering ni timeout corto,
    # o el navegador perderia los eventos de match.
    location /api/matchmaking/stream {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        proxy_set_header Connection '';

        proxy_set_header CF-IPCountry $cf_country;
        proxy_set_header X-Vercel-IP-Country "";
        proxy_set_header X-Geo-Country "";
        proxy_set_header X-Country-Code "";

        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;
    }

    # ------------------------------------------------------------------------
    # LIVEKIT (SFU de video, en 127.0.0.1:7880)
    #
    # Se expone por el mismo dominio para no depender de otro registro DNS:
    #   - /rtc  ..... senalizacion WebSocket del cliente (y /rtc/validate)
    #   - /twirp .... API que usa livekit-server-sdk desde el servidor
    #
    # El MEDIA no pasa por aqui: viaja por WebRTC directo a los puertos
    # 7882/udp y 7881/tcp de esta maquina, porque Cloudflare no proxia UDP.
    # ------------------------------------------------------------------------
    location /rtc {
        proxy_pass http://127.0.0.1:7880;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # La senalizacion es una conexion larga: sin esto se corta al minuto.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location /twirp/ {
        proxy_pass http://127.0.0.1:7880;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Estaticos con hash en el nombre: cache larga e inmutable.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Reto HTTP-01 de Let's Encrypt (renovacion del certificado).
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    # Nunca servir ficheros de entorno ni metadatos de git.
    location ~ /\.(env|git) {
        deny all;
        return 404;
    }
}

##############################################################################
# HTTPS
#
# El bloque 443 lo anade y mantiene certbot:
#   certbot --nginx -d tudominio.com
#
# Con Cloudflare delante, ademas hay que poner el modo SSL/TLS en
# "Full (strict)": con "Flexible" el tramo Cloudflare -> origen viaja en claro,
# y con el origen sin certificado valido Cloudflare devuelve error 521.
#
# Tras activar HTTPS hay que cambiar NEXT_PUBLIC_APP_URL, NEXTAUTH_URL y
# AUTH_URL del .env a https:// y reiniciar (systemctl restart fantasylive).
# Hasta entonces la cookie de sesion no puede marcarse Secure.
##############################################################################
